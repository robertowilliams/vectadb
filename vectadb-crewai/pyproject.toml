[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectadb-crewai"
version = "0.1.0"
description = "VectaDB audit and observability integration for CrewAI"
authors = [
    { name = "Roberto Williams Batista", email = "robertobatista@ieee.org" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vectadb", "crewai", "audit", "observability", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "crewai>=0.80.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/robertowilliams/VectaDB"
Repository = "https://github.com/robertowilliams/VectaDB"
Issues = "https://github.com/robertowilliams/VectaDB/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vectadb_crewai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
