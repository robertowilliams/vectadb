[package]
name = "vectadb-logflyer"
version = "0.1.0"
edition = "2021"
authors = ["Roberto Williams Batista"]
description = "LLM-powered log agent — tails local files, identifies agentic activity, ingests to VectaDB"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (LLM + VectaDB)
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1.10"

# Environment
dotenvy = "0.15"

[[bin]]
name = "vectadb-logflyer"
path = "src/main.rs"
