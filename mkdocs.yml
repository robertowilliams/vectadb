site_name: VectaDB
site_description: The Observability Database for LLM Agents
site_url: https://robertowilliams.github.io/vectadb
repo_url: https://github.com/robertowilliams/VectaDB
repo_name: robertowilliams/VectaDB
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/vectadb.css

nav:
  - Home: index.md
  - Product Overview: product-overview.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md
  - Core Features: core-features.md
  - API Reference: api-reference.md
  - Integrations: integrations.md
  - Performance & Benchmarks: performance.md
  - Deployment Guide: deployment.md
  - Roadmap: roadmap.md
  - QA & Testing: qa-testing.md
  - Business Case: business-case.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/robertowilliams/VectaDB
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/vectadb
  analytics:
    provider: google
    property: G-XXXXXXXXXX

copyright: Copyright &copy; 2026 VectaDB
